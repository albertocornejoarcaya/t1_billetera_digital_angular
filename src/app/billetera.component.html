<main class="container-fluid min-vh-100 d-flex bg-light py-4">
  <section class="container flex-grow-1 border border-2 border-dark rounded-3 bg-white p-4 d-flex flex-column">
    <div class="w-50">
        <p class="badge text-bg-dark mb-4">Billetera Digital</p>
        <p class="text-secondary mb-1">Saldo actual</p>
        <h1 class="text-success fw-bold mb-2">S/ {{ saldo.toFixed(2) }}</h1>

        <h2 class="h6 fw-bold">Movimientos Recientes</h2>

      @if (movimientos.length === 0) {
        <div class="alert alert-secondary py-2" role="status">
          No existen movimientos registrados
        </div>
      } @else {
        <div class="list-group">
          @for (mov of movimientos; track $index) {
            <div class="list-group-item d-flex justify-content-between align-items-center py-2">
              <span
                class="badge rounded-pill"
                [class.text-bg-success]="mov.tipo === 'Recarga'"
                [class.text-bg-danger]="mov.tipo === 'Gasto'">
                {{ mov.tipo }}
              </span>
              <span
                [class.text-success]="mov.tipo === 'Recarga'"
                [class.text-danger]="mov.tipo === 'Gasto'">
                {{ mov.tipo === 'Recarga' ? '+' : '-' }} S/ {{ mov.monto.toFixed(2) }}
              </span>
            </div>
          }
        </div>
      }
    </div>

    <div class="w-50 ms-auto mt-auto pt-4">
      <app-nuevo-movimiento
        [saldo]="saldo"
        (registrarMovimiento)="agregarMovimiento($event)">
      </app-nuevo-movimiento>
    </div>
  </section>
</main>
